name: reservation-management-system

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reservation_management}
      POSTGRES_USER: ${POSTGRES_USER:-reservation_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-reservation_management}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-reservation_app}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:?Generate JWT_SECRET_BASE64 in .env using scripts/setup-env.mjs}
      AUTH_COOKIE_SECURE: "false"
      HOTEL_TIME_ZONE: ${HOTEL_TIME_ZONE:-America/Lima}
      HOTEL_ARRIVAL_DEADLINE: ${HOTEL_ARRIVAL_DEADLINE:-22:00}
      AUTH_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-3000},http://localhost:5173,http://localhost:${BACKEND_PORT:-8080}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/v1/system/health/readiness"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend-tests:
    profiles: ["test"]
    image: eclipse-temurin:21-jdk-alpine
    working_dir: /workspace
    volumes:
      - ./backend:/workspace
      - maven_cache:/root/.m2
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: ["sh", "./mvnw", "-B", "-ntp", "verify"]

volumes:
  postgres_data:
  maven_cache:
