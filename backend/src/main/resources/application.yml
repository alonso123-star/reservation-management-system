spring:
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  application:
    name: reservation-management-system
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/reservation_management}
    username: ${SPRING_DATASOURCE_USERNAME:reservation_app}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      connection-timeout: 3000
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    clean-disabled: true
    validate-on-migrate: true

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      base-path: /api/v1/system
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}

security:
  auth:
    jwt-secret: ${JWT_SECRET_BASE64}
    issuer: reservation-management-system
    audience: reservation-web
    access-ttl: 15m
    refresh-ttl: 7d
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
    allowed-origins: ${AUTH_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}
