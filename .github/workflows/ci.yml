name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: JUnit and PostgreSQL integration tests
        working-directory: backend
        run: sh ./mvnw -B -ntp verify

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
      - run: npm ci --prefix frontend
      - run: npm run typecheck:e2e --prefix frontend
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Build and start isolated production stack
        run: node scripts/demo.mjs e2e up
      - run: node scripts/smoke.mjs
        env:
          SMOKE_BASE_URL: http://localhost:3002
      - name: Real browser journeys
        run: npm run test:e2e --prefix frontend
      - name: Stop disposable CI environment
        if: always()
        run: node scripts/demo.mjs e2e reset
