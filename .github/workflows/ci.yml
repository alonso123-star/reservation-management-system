name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: JUnit and PostgreSQL integration tests
        working-directory: backend
        run: sh ./mvnw -B -ntp verify

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
      - name: Create disposable local configuration
        run: node scripts/setup-env.mjs
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 240
      - run: node scripts/smoke.mjs
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 150
      - name: Stop disposable CI environment
        if: always()
        run: docker compose down --volumes
